<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow" />
  <title>Nachricht gesendet | Thomas Wodny</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100' height='100' rx='12' fill='%231C1917'/%3E%3Cpath d='M50,8 L88,22 L88,50 Q88,78 50,92 Q12,78 12,50 L12,22 Z' fill='%23B07D1E' opacity='0.12'/%3E%3Cpath d='M50,8 L88,22 L88,50 Q88,78 50,92 Q12,78 12,50 L12,22 Z' fill='none' stroke='%23B07D1E' stroke-width='3'/%3E%3Ctext x='50' y='54' text-anchor='middle' dominant-baseline='central' font-family='Georgia,serif' font-weight='700' font-size='36' fill='%23B07D1E'%3ETW%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #0d1225;
      --bg-panel: rgba(10, 20, 40, 0.85);
      --text-primary: #e8e0d0;
      --text-secondary: #b0a080;
      --text-tertiary: #8a7a5a;
      --cyan: #ffbe2e;
      --cyan-bg: rgba(255, 190, 46, 0.06);
      --cyan-border: rgba(255, 190, 46, 0.25);
      --border: rgba(255, 190, 46, 0.12);
      --border-bright: rgba(255, 190, 46, 0.35);
      --shadow-glow: 0 0 20px rgba(255, 190, 46, 0.15);
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 190, 46, 0.07), transparent 60%),
        var(--bg-primary);
      font-family: var(--font-body);
      color: var(--text-primary);
    }

    .panel {
      width: 100%;
      max-width: 560px;
      padding: 48px 40px;
      background: var(--bg-panel);
      border: 1px solid var(--border-bright);
      box-shadow: var(--shadow-glow);
      text-align: center;
      position: relative;
    }

    /* HUD-Ecken wie auf der Startseite */
    .panel::before,
    .panel::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid var(--cyan);
    }
    .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      color: var(--cyan);
      filter: drop-shadow(0 0 12px rgba(255, 190, 46, 0.4));
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--cyan);
      margin-bottom: 18px;
    }

    p {
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.65;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    p.en {
      font-size: 0.95rem;
      color: var(--text-tertiary);
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: 24px;
    }

    .back {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 28px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: var(--cyan);
      background: var(--cyan-bg);
      border: 1px solid var(--cyan-border);
      transition: var(--transition);
    }

    .back:hover,
    .back:focus-visible {
      background: rgba(255, 190, 46, 0.14);
      border-color: var(--border-bright);
      box-shadow: var(--shadow-glow);
    }

    @media (max-width: 480px) {
      .panel { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <main class="panel" role="status">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <h1>ÜBERTRAGUNG ERFOLGREICH</h1>
    <p>Ihre Nachricht wurde gesendet. Ich melde mich zeitnah bei Ihnen.</p>
    <p class="en">Your message has been sent. I will get back to you shortly.</p>
    <a class="back" href="/">&larr; ZURÜCK ZUR STARTSEITE</a>
  </main>
</body>
</html>
